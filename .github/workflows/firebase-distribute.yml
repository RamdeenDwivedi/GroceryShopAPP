# Workflow for Firebase App Distribution (Official Gradle Integration)
name: Firebase App Distribution

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew testDebugUnitTest

      - name: Build and Upload to Firebase App Distribution
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Use printf to write the secret safely to an absolute path
          printf "%s" "$SERVICE_ACCOUNT_JSON" > ${{ github.workspace }}/service-account.json
          
          if [ ! -s ${{ github.workspace }}/service-account.json ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT secret is missing or empty"
            exit 1
          fi
          
          # Run the official Gradle task for distribution, passing the absolute path to the credentials
          ./gradlew assembleRelease appDistributionUploadRelease -PappDistributionServiceCredentialsFile=${{ github.workspace }}/service-account.json
