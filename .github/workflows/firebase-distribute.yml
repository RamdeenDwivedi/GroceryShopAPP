# Workflow for Firebase App Distribution
name: Firebase App Distribution

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew testDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "❌ FIREBASE_SERVICE_ACCOUNT is missing"; exit 1; fi
          if [ -z "$FIREBASE_APP_ID" ]; then echo "❌ FIREBASE_APP_ID is missing"; exit 1; fi
          
          # Write service account to file
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          
          # Trim whitespace from APP_ID just in case
          APP_ID=$(echo "$FIREBASE_APP_ID" | xargs)
          
          sudo npm install -g firebase-tools
          firebase appdistribution:distribute app/build/outputs/apk/release/app-release-unsigned.apk \
            --app "$APP_ID" \
            --groups "testers"
